host: localhost:8090
info:
  contact: {}
  description: Backend API for AutoPulse's shop/mağaza listings — public shop/product
    browsing plus a simple cookie-based shop-owner login.
  title: AutoPulse Mağazalar API
  version: "1.0"
paths:
  /:
    get:
      description: Returns a lightweight summary of every shop (id, name, title).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shop.ShopSummary'
            type: array
        "500":
          description: internal error
          schema:
            type: string
      summary: List all shops
      tags:
      - shops
  /{shopId}/products:
    get:
      description: Returns all products belonging to the given shop id.
      parameters:
      - description: Shop id
        in: path
        name: shopId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shop.Product'
            type: array
        "400":
          description: invalid shopId
          schema:
            type: string
        "404":
          description: shop not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: List a shop's products
      tags:
      - shops
  /by-name/{name}:
    get:
      description: Returns full shop details for the given name (the shop's slug).
      parameters:
      - description: Shop name/slug
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shop.Shop'
        "404":
          description: shop not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Get a shop by its name
      tags:
      - shops
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a shop by name+password and sets an HttpOnly shop_session
        cookie on success.
      parameters:
      - description: Shop name and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.loginResponse'
        "400":
          description: invalid request body
          schema:
            type: string
        "401":
          description: invalid name or password
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Shop owner login
      tags:
      - auth
  /logout:
    post:
      responses:
        "200":
          description: ok
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Log out the current user session
      tags:
      - user
  /me/logo:
    post:
      consumes:
      - multipart/form-data
      description: Requires a valid shop_session cookie.
      parameters:
      - description: Logo image file
        in: formData
        name: logo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid multipart form or no file
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Upload the logged-in shop's logo
      tags:
      - auth
  /me/products:
    get:
      description: Requires a valid user_session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.Product'
            type: array
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: List the logged-in user's own listings, any status
      tags:
      - user
    post:
      consumes:
      - application/json
      description: Requires a valid user_session cookie. New listings start in 'gozlemede'
        (pending moderation).
      parameters:
      - description: New listing details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.createProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.Product'
        "400":
          description: invalid request body
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Create a new listing for the logged-in user
      tags:
      - user
  /me/products/{id}:
    delete:
      description: Requires a valid user_session cookie. Sets status to legv_edilib
        — does not remove the row.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: invalid product id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: listing not found or not owned by this user
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Cancel (soft-delete) a listing owned by the logged-in user
      tags:
      - user
    put:
      consumes:
      - application/json
      description: Requires a valid user_session cookie. The listing must belong to
        the authenticated user. Editing a legv_edilib listing sends it back to gozlemede
        for re-moderation.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      - description: Updated listing details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.createProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.Product'
        "400":
          description: invalid product id or request body
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: listing not found or not owned by this user
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Update a listing owned by the logged-in user
      tags:
      - user
  /me/products/{id}/images:
    post:
      consumes:
      - multipart/form-data
      description: Requires a valid user_session cookie. The listing must belong to
        the authenticated user.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      - description: One or more image files
        in: formData
        name: images
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.ProductImage'
            type: array
        "400":
          description: invalid product id or no files
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: listing not found or not owned by this user
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Upload one or more images for a listing
      tags:
      - user
  /me/products/{id}/images/{imageId}:
    delete:
      description: Requires a valid shop_session cookie. The image's product must
        belong to the authenticated shop.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      - description: Image id
        in: path
        name: imageId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: invalid product or image id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: product or image not found, or not owned by this shop
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Delete a single image from a product owned by the logged-in shop
      tags:
      - auth
  /me/products/{id}/restore:
    post:
      description: Requires a valid shop_session cookie. The product must belong to
        the authenticated shop.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: invalid product id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: product not found or not owned by this shop
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Restore a cancelled (ləğv edilib) product back to saytda
      tags:
      - auth
  /otp/request:
    post:
      consumes:
      - application/json
      description: Always succeeds — no real SMS is sent in this environment; the
        test code is a fixed value.
      parameters:
      - description: Phone number
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.otpRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: invalid request body
          schema:
            type: string
      summary: Request an OTP code for phone-based login
      tags:
      - user
  /otp/verify:
    post:
      consumes:
      - application/json
      description: Test code is a fixed value ("1234") — no real SMS/OTP provider.
        Creates a new user account automatically on first login. Sets a user_session
        HttpOnly cookie on success.
      parameters:
      - description: Phone number and OTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.otpVerifyBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.otpVerifyResponse'
        "400":
          description: invalid request body
          schema:
            type: string
        "401":
          description: invalid code
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Verify an OTP code and log in (or auto-register) by phone
      tags:
      - user
  /products/{id}/approve:
    post:
      description: Requires a valid admin_session cookie. Sets the listing's status
        to saytda.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: invalid product id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Approve a pending user listing
      tags:
      - admin
  /products/{id}/reject:
    post:
      description: Requires a valid admin_session cookie. Sets the listing's status
        to legv_edilib.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: invalid product id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Reject a pending user listing
      tags:
      - admin
  /products/pending:
    get:
      description: Requires a valid admin_session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.Product'
            type: array
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: List all user listings pending moderation
      tags:
      - admin
  /shop-products:
    get:
      description: Requires a valid admin_session cookie. Superadmin oversight — not
        scoped to any single shop.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shop.Product'
            type: array
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: List every shop product across all shops, any status
      tags:
      - admin
  /shop-products/{id}/cancel:
    post:
      description: Requires a valid admin_session cookie. Uses the same soft-delete
        as the shop owner's own "Sil" button — no ownership check, since superadmin
        acts across all shops.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: invalid product id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Cancel any shop's product (superadmin override)
      tags:
      - admin
swagger: "2.0"
