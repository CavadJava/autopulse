basePath: /api/shops
definitions:
  auth.createProductRequest:
    properties:
      ban:
        type: string
      details:
        type: string
      il:
        type: integer
      marka:
        type: string
      model:
        type: string
      name:
        type: string
      qiymet:
        type: integer
      title:
        type: string
      yanacaq:
        type: string
      yurus:
        type: integer
    type: object
  auth.loginRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  auth.loginResponse:
    properties:
      shop:
        $ref: '#/definitions/shop.ShopSummary'
    type: object
  auth.updateProductRequest:
    properties:
      ban:
        type: string
      details:
        type: string
      il:
        type: integer
      marka:
        type: string
      model:
        type: string
      name:
        type: string
      qiymet:
        type: integer
      title:
        type: string
      yanacaq:
        type: string
      yurus:
        type: integer
    type: object
  shop.Product:
    properties:
      ban:
        type: string
      details:
        type: string
      id:
        type: integer
      il:
        type: integer
      images:
        items:
          $ref: '#/definitions/shop.ProductImage'
        type: array
      marka:
        type: string
      model:
        type: string
      name:
        type: string
      qiymet:
        type: integer
      status:
        type: string
      title:
        type: string
      yanacaq:
        type: string
      yurus:
        type: integer
    type: object
  shop.ProductImage:
    properties:
      id:
        type: integer
      minioUrl:
        type: string
      s3Url:
        type: string
      sira:
        type: integer
    type: object
  shop.Shop:
    properties:
      customerId:
        type: integer
      details:
        type: string
      id:
        type: integer
      logoUrl:
        type: string
      name:
        type: string
      title:
        type: string
      workTimes:
        type: string
    type: object
  shop.ShopSummary:
    properties:
      id:
        type: integer
      name:
        type: string
      title:
        type: string
    type: object
host: localhost:8090
info:
  contact: {}
  description: Backend API for AutoPulse's shop/mağaza listings — public shop/product
    browsing plus a simple cookie-based shop-owner login.
  title: AutoPulse Mağazalar API
  version: "1.0"
paths:
  /:
    get:
      description: Returns a lightweight summary of every shop (id, name, title).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shop.ShopSummary'
            type: array
        "500":
          description: internal error
          schema:
            type: string
      summary: List all shops
      tags:
      - shops
  /{shopId}/products:
    get:
      description: Returns all products belonging to the given shop id.
      parameters:
      - description: Shop id
        in: path
        name: shopId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shop.Product'
            type: array
        "400":
          description: invalid shopId
          schema:
            type: string
        "404":
          description: shop not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: List a shop's products
      tags:
      - shops
  /by-name/{name}:
    get:
      description: Returns full shop details for the given name (the shop's slug).
      parameters:
      - description: Shop name/slug
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shop.Shop'
        "404":
          description: shop not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Get a shop by its name
      tags:
      - shops
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a shop by name+password and sets an HttpOnly shop_session
        cookie on success.
      parameters:
      - description: Shop name and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.loginResponse'
        "400":
          description: invalid request body
          schema:
            type: string
        "401":
          description: invalid name or password
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Shop owner login
      tags:
      - auth
  /logout:
    post:
      description: Deletes the server-side session and clears the shop_session cookie.
        Returns 500 (and leaves the cookie/session intact) if server-side deletion
        fails.
      responses:
        "200":
          description: ok
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Log out the current shop session
      tags:
      - auth
  /me/logo:
    post:
      consumes:
      - multipart/form-data
      description: Requires a valid shop_session cookie.
      parameters:
      - description: Logo image file
        in: formData
        name: logo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid multipart form or no file
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Upload the logged-in shop's logo
      tags:
      - auth
  /me/products:
    get:
      description: Requires a valid shop_session cookie (set by /login).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shop.Product'
            type: array
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: List the logged-in shop's own products
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Requires a valid shop_session cookie. Creates a shop_products row
        owned by the authenticated shop.
      parameters:
      - description: New product details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.createProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/shop.Product'
        "400":
          description: invalid request body
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Create a new product for the logged-in shop
      tags:
      - auth
  /me/products/{id}:
    delete:
      description: Requires a valid shop_session cookie. Deletes the product and all
        its images.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: invalid product id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: product not found or not owned by this shop
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Delete a product owned by the logged-in shop
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Requires a valid shop_session cookie. The product must belong to
        the authenticated shop.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      - description: Updated product details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.updateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shop.Product'
        "400":
          description: invalid product id or request body
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: product not found or not owned by this shop
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Update an existing product owned by the logged-in shop
      tags:
      - auth
  /me/products/{id}/images:
    post:
      consumes:
      - multipart/form-data
      description: Requires a valid shop_session cookie. The product must belong to
        the authenticated shop.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      - description: One or more image files
        in: formData
        name: images
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shop.ProductImage'
            type: array
        "400":
          description: invalid product id or no files
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: product not found or not owned by this shop
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Upload one or more images for a product
      tags:
      - auth
  /me/products/{id}/images/{imageId}:
    delete:
      description: Requires a valid shop_session cookie. The image's product must
        belong to the authenticated shop.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      - description: Image id
        in: path
        name: imageId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: invalid product or image id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: product or image not found, or not owned by this shop
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Delete a single image from a product owned by the logged-in shop
      tags:
      - auth
  /me/products/{id}/restore:
    post:
      description: Requires a valid shop_session cookie. The product must belong to
        the authenticated shop.
      parameters:
      - description: Product id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: invalid product id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: product not found or not owned by this shop
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Restore a cancelled (ləğv edilib) product back to saytda
      tags:
      - auth
swagger: "2.0"
