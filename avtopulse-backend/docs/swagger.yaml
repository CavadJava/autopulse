  user.Product:
    properties:
      ban:
        type: string
      details:
        type: string
      id:
        type: integer
      il:
        type: integer
      images:
        items:
          $ref: '#/definitions/user.ProductImage'
        type: array
      marka:
        type: string
      model:
        type: string
      qiymet:
        type: integer
      status:
        type: string
      title:
        type: string
