      details:
        type: string
      il:
        type: integer
      marka:
        type: string
      model:
        type: string
      qiymet:
        type: integer
      title:
        type: string
      yanacaq:
        type: string
      yurus:
        type: integer
    type: object
  user.otpRequestBody:
