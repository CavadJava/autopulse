        type: string
      username:
        type: string
    type: object
  auth.createProductRequest:
    properties:
      ban:
        type: string
      details:
        type: string
      il:
        type: integer
      marka:
        type: string
      model:
        type: string
      name:
        type: string
      qiymet:
        type: integer
      title:
        type: string
      yanacaq:
        type: string
      yurus:
        type: integer
    type: object
  auth.loginRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  auth.loginResponse:
    properties:
      shop:
        $ref: '#/definitions/shop.ShopSummary'
    type: object
  auth.updateProductRequest:
    properties:
      ban:
        type: string
      details:
        type: string
      il:
        type: integer
      marka:
        type: string
      model:
        type: string
      name:
